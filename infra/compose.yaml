name: pathway
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pathway
      POSTGRES_PASSWORD: pathway-local-db
      POSTGRES_DB: pathway
    ports: ['127.0.0.1:55433:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pathway -d pathway']
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    build: { context: ., dockerfile: minio.Dockerfile, target: minio }
    image: pathway-minio:7aac2a2
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pathway
      MINIO_ROOT_PASSWORD: pathway-local-storage
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
  minio-init:
    build: { context: ., dockerfile: minio.Dockerfile, target: mc }
    image: pathway-mc:77f82e1
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      [
        '-c',
        'until mc alias set local http://minio:9000 pathway pathway-local-storage; do sleep 2; done; mc mb --ignore-existing local/pathway-private; mc anonymous set none local/pathway-private',
      ]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  clamav:
    image: clamav/clamav:1.4
    ports: ['127.0.0.1:3310:3310']
    volumes: ['clamav-data:/var/lib/clamav']
volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
